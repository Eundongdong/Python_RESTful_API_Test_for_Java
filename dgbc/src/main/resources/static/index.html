<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Flask 연동 테스트 화면</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .result {
            margin-top: 24px;
            padding: 12px;
            border-radius: 4px;
            background: #f7f7f7;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .error {
            color: #c00;
        }
    </style>
</head>
<body>

<h1>Java → Flask 파일명 전송 테스트</h1>

<form id="predict-form">
    <label for="fileName">파일 이름 (file_name)</label>
    <input type="text" id="fileName" name="fileName" placeholder="예: sample.txt" required>

    <button type="submit" id="submitBtn">Flask 호출하기</button>
</form>

<div class="result" id="resultBox" style="display:none;"></div>

<script>
    const form = document.getElementById('predict-form');
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const fileNameInput = document.getElementById('fileName');
        const fileName = fileNameInput.value.trim();
        if (!fileName) {
            alert('파일 이름을 입력해 주세요.');
            return;
        }

        submitBtn.disabled = true;
        resultBox.style.display = 'block';
        resultBox.classList.remove('error');
        resultBox.textContent = '요청 중...';

        try {
            const response = await fetch('http://127.0.0.1:8080/api/python/upload', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    file_name: fileName
                })
            });

            const text = await response.text();

            let data;
            try {
                data = JSON.parse(text);  // JSON 파싱 시도
            } catch (e) {

                resultBox.classList.add('error');
                resultBox.textContent =
                    'Flask서버에서 JSON이 아닌 응답:\n\n' + text;
                return;
            }

            if (!response.ok) {
                resultBox.classList.add('error');
                resultBox.textContent =
                    '요청 실패 (' + response.status + '):\n' + JSON.stringify(data, null, 2);
                return;
            }

            resultBox.classList.remove('error');
            resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            resultBox.classList.add('error');
            resultBox.textContent = '네트워크 오류 또는 서버 오류:\n' + e;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
